[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resp_metrics"
version = "0.1.0"
description = "Cycle-by-cycle ventilatory metrics (BF, VT, VE, Ti, Te, Ttot, ...)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Damien Bachasson", email = "damien.bachasson@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.22",
  "pandas>=1.5",
  "labchart_parser @ git+https://github.com/Neures-1158/labchart_txt_parser.git"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
keywords = ["respiration", "ventilation", "physiology", "metrics"]

[project.urls]
Homepage = "https://github.com/Neures-1158/resp_metrics"
Repository = "https://github.com/Neures-1158/resp_metrics"
Changelog = "https://github.com/Neures-1158/resp_metrics/blob/main/CHANGELOG.md"
Issues = "https://github.com/Neures-1158/resp_metrics/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
dev = [
  "pytest>=7",
  "pytest-cov>=4.0",
  "ruff>=0.4",
  "black>=24.0",
  "isort>=5.13",
  "mypy>=1.6",
  "twine>=5.0",
  "build>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/resp_metrics"]
branch = true
omit = ["*/__pycache__/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 90
show_missing = true
